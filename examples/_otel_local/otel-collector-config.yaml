receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4313

exporters:
  # Prints everything received, for local inspection.
  debug:
    verbosity: detailed

  # Scraped by Prometheus.
  prometheus:
    endpoint: "0.0.0.0:9464"

  # Traces go to Tempo.
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]
