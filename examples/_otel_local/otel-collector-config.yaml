receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4313

exporters:
  # 🔹 Exporter pour debug local (remplace l'ancien "logging")
  debug:
    verbosity: detailed

  # 🔹 Export Prometheus (pour les métriques)
  prometheus:
    endpoint: "0.0.0.0:9464"

  # 🔹 Export vers Tempo (pour les traces)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]
