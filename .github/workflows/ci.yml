name: 🧱 pipeyard Library CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pipeline:
    name: 🧩 pipeyard CI Pipeline
    runs-on: ubuntu-latest

    container:
      image: rridane/pipeyard-ci:0.0.1
      options: --privileged
      env:
        DOCKER_BUILDKIT: "1"
        BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"

    strategy:
      matrix:
        go-version: [ '1.23' ]

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
      - name: 🧪 Run tests via pipeyard
        run: go run ./ci test --timeout 120s

      - name: ⚙️ Build library via pipeyard
        run: go run ./ci build

      - name: 🚀 Release via pipeyard
        if: startsWith(github.ref, 'refs/tags/')
        run: go run ./ci release ${GITHUB_REF#refs/tags/} --branch main --publish

      - name: 🔑 Docker login
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin

