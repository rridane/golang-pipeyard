name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compile the whole module, then the pipeline binary. Everything below
      # calls that binary, so nothing here needs to change when a stage does.
      - name: Build
        run: |
          go build ./...
          go build -o bin/pipeyard-ci ./ci

      - name: Format
        run: bin/pipeyard-ci fmt

      - name: Vet
        run: bin/pipeyard-ci vet

      - name: Test
        run: bin/pipeyard-ci test --timeout 5m
