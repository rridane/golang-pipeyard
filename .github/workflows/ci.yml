name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This repository compiles its own pipeline on purpose: a change to ci/
      # must be validated by the pipeline it changes. Consumer projects run a
      # published image instead and never build — see the README.
      - name: Build
        run: |
          go build ./...
          go build -o bin/pipeyard-ci ./ci

      - name: Format
        run: bin/pipeyard-ci fmt

      - name: Vet
        run: bin/pipeyard-ci vet

      - name: Test
        run: bin/pipeyard-ci test --timeout 5m

  # A tag publishes the distribution image. This is the only place the binary
  # is produced; consumer projects pull the image and never build.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The release stage drives BuildKit over gRPC, so a daemon has to be up.
      - name: Start BuildKit
        run: |
          docker run -d --name buildkit --privileged \
            -p 1234:1234 moby/buildkit:latest --addr tcp://0.0.0.0:1234
          timeout 60 sh -c 'until docker logs buildkit 2>&1 | grep -q "running server"; do sleep 1; done'

      # docker login writes ~/.docker/config.json, which the builder reads.
      - name: Log in to Docker Hub
        run: echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USER }}' --password-stdin

      - name: Build and push the pipeline image
        run: |
          go build -o bin/pipeyard-ci ./ci
          bin/pipeyard-ci release --version "${GITHUB_REF_NAME#v}" --push

      - uses: actions/upload-artifact@v4
        with:
          name: pipeyard-ci-${{ github.ref_name }}
          path: dist/pipeyard-ci
