name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Smoke check: the pipeline below is itself a Go program in this module,
      # so it cannot run if the module does not build.
      - name: Build
        run: go build ./...

      # From here on, Pipeyard runs its own pipeline.
      - name: Format
        run: go run ./ci fmt

      - name: Vet
        run: go run ./ci vet

      - name: Test
        run: go run ./ci test --timeout 5m
