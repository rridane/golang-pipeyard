# What a project that uses a pipeline writes. Nothing here is specific to
# Pipeyard's own repository: fetch the published pipeline, call its stages.
name: Consumer repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pipeyard reads its own variable names; mapping this engine's onto them is
# this file's job, which is why no Go package names a CI engine.
env:
  PIPEYARD_PROJECT: ${{ github.repository }}
  PIPEYARD_BRANCH: ${{ github.ref_name }}
  PIPEYARD_COMMIT_SHA: ${{ github.sha }}
  # Absent on a pull request, where no deployment is measured from it.
  PIPEYARD_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}

jobs:
  # The published binary judges the change. The toolchain comes from the
  # runner, pinned to the version go.mod asks for, so the race detector works.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch the published pipeline
        run: |
          mkdir -p bin
          curl -fsSL -o bin/pipeyard-ci \
            "https://github.com/${{ github.repository }}/releases/latest/download/pipeyard-ci"
          chmod +x bin/pipeyard-ci

      - run: bin/pipeyard-ci build
      - run: bin/pipeyard-ci fmt
      - run: bin/pipeyard-ci vet
      - run: bin/pipeyard-ci test --timeout 5m

  # The same pipeline, delivered as an image, for a project that would rather
  # install nothing. It is the only job that runs a stage inside the container,
  # so the only one that catches what breaks there and nowhere else.
  image:
    if: github.event_name == 'push'
    needs: binary
    runs-on: ubuntu-latest

    # The image runs as uid 1001, which is what the runner owns the mounted
    # workspace with, so no step needs root.
    # The floating major tag, which is 0 until the 1.0.0 release.
    container:
      image: ghcr.io/rridane/pipeyard:0

    steps:
      - uses: actions/checkout@v4
      - run: pipeyard-ci vet
